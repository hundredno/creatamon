<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Creatamon</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="game">
    <canvas id="world" width="1440" height="1056"></canvas>
    <canvas id="overlay" width="1440" height="1056"></canvas>
    <div id="hud" title="Open the menu"><div class="row"><b id="area"></b><span id="coins"></span></div><div id="goal"></div></div>
    <div id="place"></div>
    <div id="toast"></div>
    <canvas id="minimap" width="248" height="192"></canvas>
    <div id="keys">Enter: talk &nbsp;·&nbsp; M: menu &nbsp;·&nbsp; E: bag &nbsp;·&nbsp; Q: bike &nbsp;·&nbsp; G: spray</div>

    <div id="pad" hidden>
      <div class="dpad"><button data-hold="arrowup" class="u">▲</button><button data-hold="arrowleft" class="l">◀</button><button data-hold="arrowright" class="r">▶</button><button data-hold="arrowdown" class="d">▼</button></div>
      <div class="acts"><button data-tap="m">☰</button><button data-tap="e">🎒</button><button data-tap="q">🚲</button><button data-tap="Enter" class="a">A</button></div>
    </div>
    <div id="battle" hidden>
      <div class="info foe">
        <div><b id="foeName"></b> <span id="foeLv"></span></div>
        <div class="bar"><i id="foeBar"></i></div>
      </div>
      <div class="pad foe"></div>
      <div class="pad me"></div>
      <canvas id="foeSprite" class="sprite" width="180" height="180"></canvas>
      <canvas id="meSprite" class="sprite" width="180" height="180"></canvas>
      <div class="info me">
        <div><b id="meName"></b> <span id="meLv"></span></div>
        <div class="bar"><i id="meBar"></i></div>
        <div id="meHp"></div>
        <div class="bar xp"><i id="meXp"></i></div>
      </div>
      <canvas id="fx" width="720" height="528"></canvas>
    </div>
    <div id="actions" hidden></div>

    <div id="dialog" hidden></div>
    <div id="menu" hidden></div>

    <div id="title">
      <h1>CREATAMON</h1>
      <p>Forge your own creatures. Solve fourteen gyms. Take the Champion Cup.</p>
      <button id="btnContinue" hidden>Continue</button>
      <button id="btnNew">New Game</button>
    </div>
  </div>
  <script src="js/sfx.js"></script>
  <script src="js/core.js"></script>
  <script src="js/world.js"></script>
  <script src="js/draw.js"></script>
  <script src="js/gl.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
